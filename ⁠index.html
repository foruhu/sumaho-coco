<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumaho-coco</title>
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
        }
        h2 { color: #bb86fc; font-size: 1.1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        button {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 18px 12px;
            font-size: 1rem;
            touch-action: manipulation;
        }
        button:active { background: #333; }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #03dac6;
            color: #000;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.25s ease-out;
            z-index: 999;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <h2>📱 Sumaho-coco (稼働確認版)</h2>
    <div class="grid">
        <button onclick="copy('1d100<=50 心理学')">心理学 (50)</button>
        <button onclick="copy('1d100<=70 目星')">目星 (70)</button>
        <button onclick="copy('1d100<=80 聞き耳')">聞き耳 (80)</button>
        <button onclick="copy('【宣言】移動します')">移動宣言</button>
    </div>
    <div id="toast">コピーしました！</div>
    <script>
        function copy(text) {
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById('toast');
                t.textContent = `コピー: ${text}`;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1500);
            });
        }
    </script>
</body>
</html>
