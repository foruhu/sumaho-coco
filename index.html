<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumaho-coco セッション支援</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="scenario-selector">
        <span style="font-weight:bold; color:#c084fc;">📁 シナリオ:</span>
        <select id="scenarioSelect" onchange="switchScenario(this.value)"></select>
        <button onclick="addScenario()" style="padding:4px 8px; font-size:0.7rem;">+追加</button>
    </div>

    <h2>
        <span>📱 Sumaho-coco</span>
        <span>
            <button onclick="addTab()" style="font-size:0.7rem; padding:3px 8px;">+タブ追加</button>
            <button onclick="resetAllData()" style="font-size:0.7rem; padding:3px 8px; color:#ef4444; border-color:#ef4444;">初期化</button>
        </span>
    </h2>
    
    <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:4px;">タブ管理（名称変更・削除）:</div>
    <div class="tab-bar" id="tabBar"></div>

    <div class="import-section">
        <div style="font-weight:bold; color:var(--text); margin-bottom:6px; font-size:0.75rem;">💾 データ保存・バックアップ・読込</div>
        <div class="data-io-bar">
            <button onclick="exportDataJson()" style="background:#3b82f6; color:#fff; border:none; border-radius:6px;">📤 JSON保存（エクスポート）</button>
            <button onclick="importDataJsonPrompt()" style="background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px;">📥 JSON復元（インポート）</button>
        </div>
        <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="handleJsonFileSelect(event)">
        
        <div style="font-weight:bold; color:var(--text); margin: 10px 0 6px 0; font-size:0.75rem;">📂 ファイル読込（PDF / Word(.docx) / TXT抽出）</div>
        <input type="file" id="fileInput" accept=".txt,.json,.csv,.md,.pdf,.docx" style="width:100%; margin-bottom:6px; font-size:0.7rem;">
        <textarea id="importPreview" placeholder="ここに抽出されたテキスト、または直接ペーストした文章を解析・登録します" style="width:100%; height:55px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px; font-size:0.75rem; box-sizing:border-box; margin-bottom:6px;"></textarea>
        <button onclick="parseAndImportText()" style="background:var(--primary); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:0.75rem; cursor:pointer; width:100%;">抽出テキストを全件に登録</button>
    </div>

    <div class="grid" id="buttonGrid"></div>

    <div class="scenario-section">
        <div class="scenario-header">
            <span>📜 シナリオ・情報一覧</span>
            <span>
                <span id="scenarioProgress" style="margin-right:8px;">0 / 0 完了</span>
                <button onclick="resetAllChecks()" style="font-size:0.65rem; padding:2px 6px; color:var(--text); background:none; border:1px solid var(--border); border-radius:4px; cursor:pointer; margin-right:4px;">チェック全解除</button>
                <button onclick="clearAllScenarios()" style="font-size:0.65rem; padding:2px 6px; color:#ef4444; background:none; border:1px solid #ef4444; border-radius:4px; cursor:pointer;">全シナリオクリア</button>
            </span>
        </div>
        <div class="scenario-search-box">
            <input type="text" id="scenarioSearchInput" placeholder="🔍 話者・本文で検索..." oninput="renderScenarios()">
        </div>
        <div class="scenario-body-container">
            <div id="scenarioList"></div>
            <div id="scenarioIndexBar"></div>
        </div>
    </div>

    <div id="toast">コピーしました！</div>

    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="./main.js"></script>
</body>
</html>
