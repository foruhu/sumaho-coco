<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumaho-coco 完全版（目次横書き・改行・折り畳み・スクロール対応）</title>
    <!-- Mammoth & PDF.js for import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #6366f1;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
        }
        header {
            padding: 8px 10px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2 { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .toolbar { display: flex; gap: 4px; flex-wrap: wrap; }
        button {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        button:hover { background: var(--border); }
        .scenario-select-area {
            padding: 6px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 4px;
            font-size: 0.75rem;
            flex: 1;
        }
        .tab-bar {
            display: flex;
            overflow-x: auto;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tab-item { display: flex; align-items: center; border-right: 1px solid var(--border); flex-shrink: 0; }
        .tab-item.active { background: var(--bg); }
        .tab-btn { background: none; border: none; padding: 6px 10px; color: var(--text); cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
        .tab-edit-mini { background: none; border: none; font-size: 0.6rem; padding: 0 4px; cursor: pointer; color: var(--text-muted); }
        .grid-container {
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            max-height: 130px;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .del-btn { background: none; border: none; color: #ef4444; font-size: 0.65rem; cursor: pointer; }

        /* 目次バーの横スクロール・横書き調整 */
        .index-bar {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            padding: 6px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            align-items: center;
        }
        .index-bar::-webkit-scrollbar {
            height: 4px;
        }
        .index-bar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }
        .index-item-group {
            display: inline-flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .scenario-action-btn { background: none; border: none; color: var(--text); padding: 4px 8px; font-size: 0.65rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; writing-mode: horizontal-tb; }
        .scenario-del-btn { background: none; border: none; color: #ef4444; padding: 4px 6px; font-size: 0.65rem; cursor: pointer; flex-shrink: 0; }

        .scenario-item.sent { opacity: 0.75; }
        .scenario-item.editing { border-color: var(--primary); }
        .scenario-item.collapsed .scenario-body,
        .scenario-item.collapsed .scenario-actions-top {
            display: none;
        }
        .scenario-body {
            font-size: 0.75rem;
            word-break: break-all;
            white-space: pre-wrap;
        }
        .scenario-actions-top { display: flex; flex-direction: column; gap: 2px; border-top: 1px dashed var(--border); padding-top: 4px; margin-top: 2px; }
        .actions-row { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
        .item-tab-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 0.6rem; padding: 2px; border-radius: 3px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #334155;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .import-area { padding: 6px 8px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px; font-size: 0.7rem; white-space: pre-wrap; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .search-area { padding: 6px; display: flex; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--border); align-items: center; font-size: 0.7rem; flex-wrap: wrap; flex-shrink: 0; }
        .search-area input { flex: 1; min-width: 80px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; }
        .scenario-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h2><span>📱 Sumaho-coco</span></h2>
            <div class="toolbar">
                <button onclick="undoAction()" style="background:#d97706; color:#fff; border:none;">↩️ 戻す</button>
                <button onclick="addTab()">+タブ</button>
                <button onclick="exportDataJson()">保存</button>
                <button onclick="importDataJsonPrompt()">読込</button>
                <button onclick="resetAllData()" style="color:#ef4444; border-color:#ef4444;">初期化</button>
            </div>
            <input type="file" id="jsonFileInput" style="display:none" accept=".json" onchange="handleJsonFileSelect(event)">
        </header>

        <div class="scenario-select-area">
            <select id="scenarioSelect" onchange="switchScenario(this.value)"></select>
            <button onclick="addScenario()">+シナリオ</button>
        </div>

        <div class="tab-bar" id="tabBar"></div>
        <div class="grid-container" id="buttonGrid"></div>

        <div class="index-bar" id="scenarioIndexBar"></div>

        <div class="main-content">
            <div class="search-area">
                <input type="text" id="scenarioSearchInput" placeholder="検索..." oninput="renderScenarios()">
                <span id="scenarioProgress" style="white-space:nowrap;">0/0完了</span>
                <button onclick="toggleAllSentCollapse()" id="collapseAllBtn" title="送信済みの全体折り畳み/展開">全折り畳み切替</button>
                <button onclick="resetAllChecks()">解除</button>
                <button onclick="deleteCheckedScenarios()" style="color:#ef4444;">選択消去</button>
            </div>
            <div class="scenario-list" id="scenarioList"></div>
        </div>

        <div class="import-area">
            <div style="display:flex; gap:4px; align-items:center;">
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx" style="font-size:0.65rem; flex:1;">
                <button onclick="parseAndImportText()">インポート</button>
            </div>
            <textarea id="importPreview" placeholder="テキスト直貼り付け・ファイルプレビュー" rows="2"></textarea>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'sumaho_coco_multiscenario_v16';
        let editingScenarioId = null;
        let collapsedSentIds = {};

        let historyStack = [];
        function pushHistory() {
            historyStack.push(JSON.parse(JSON.stringify(allData)));
            if (historyStack.length > 20) historyStack.shift();
        }
        function undoAction() {
            if (historyStack.length === 0) {
                showToast('戻せる履歴がありません');
                return;
            }
            allData = historyStack.pop();
            editingScenarioId = null;
            save();
            renderAll();
            showToast('一歩前に戻しました');
        }

        const defaultData = {
            currentScenario: 'default_sc',
            scenarios: {
                'default_sc': {
                    title: 'サンプルシナリオ',
                    tabs: ['共通', 'PC1', 'KP用', '情報'],
                    currentTab: '共通',
                    customItems: {
                        '共通': [{ label: '移動宣言', text: '【宣言】移動します' }],
                        'PC1': [], 'KP用': [], '情報': []
                    },
                    scenariosList: [
                        { id: 's1', tab: '共通', speaker: 'KP', text: 'セッション開始します。\n改行テスト1行目\n2行目', isIndex: true, indexTitle: '導入' },
                        { id: 's2', tab: 'PC1', speaker: 'PC1', text: '調査を行ないます。', isIndex: true, indexTitle: '調査' }
                    ],
                    sentIds: {}
                }
            }
        };

        let allData;
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            allData = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultData));
            if (!allData.scenarios) allData = JSON.parse(JSON.stringify(defaultData));
        } catch (e) {
            allData = JSON.parse(JSON.stringify(defaultData));
        }

        function getCur() {
            if (!allData.scenarios[allData.currentScenario]) {
                const firstKey = Object.keys(allData.scenarios)[0];
                if (firstKey) allData.currentScenario = firstKey;
            }
            return allData.scenarios[allData.currentScenario];
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
            } catch (e) {
                showToast('保存容量オーバーの可能性');
            }
        }

        function exportDataJson() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `sumaho_coco_backup_${Date.now()}.json`);
            dlAnchorElem.click();
            showToast('JSON書き出し完了');
        }

        function importDataJsonPrompt() {
            document.getElementById('jsonFileInput').click();
        }

        function handleJsonFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && parsed.scenarios && parsed.currentScenario) {
                        if (confirm('現在のデータを上書きしてJSONを復元しますか？')) {
                            pushHistory();
                            allData = parsed;
                            editingScenarioId = null;
                            save();
                            renderAll();
                            showToast('JSON復元完了');
                        }
                    } else { alert('不正なJSON形式'); }
                } catch (err) { alert('読込失敗'); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function resetAllData() {
            if (confirm('データを初期化してサンプルに戻しますか？')) {
                pushHistory();
                localStorage.removeItem(STORAGE_KEY);
                allData = JSON.parse(JSON.stringify(defaultData));
                renderAll();
                showToast('初期化しました');
            }
        }

        function deleteCheckedScenarios() {
            const cur = getCur();
            const checkedIds = Object.keys(cur.sentIds).filter(id => cur.sentIds[id]);
            if (checkedIds.length === 0) { showToast('チェック付き項目なし'); return; }
            if (!confirm(`チェック付き ${checkedIds.length} 件を削除しますか？`)) return;
            pushHistory();
            const removeSet = new Set(checkedIds);
            cur.scenariosList = cur.scenariosList.filter(s => !removeSet.has(s.id));
            checkedIds.forEach(id => {
                delete cur.sentIds[id];
                delete collapsedSentIds[id];
            });
            if (editingScenarioId && removeSet.has(editingScenarioId)) editingScenarioId = null;
            save(); renderScenarios(); showToast(`${checkedIds.length} 件削除`);
        }

        function resetAllChecks() {
            const cur = getCur();
            if (Object.keys(cur.sentIds).length === 0) { showToast('解除するチェックなし'); return; }
            if (confirm('すべてのチェックを解除しますか？')) {
                pushHistory();
                cur.sentIds = {};
                collapsedSentIds = {};
                save(); renderScenarios(); showToast('全解除完了');
            }
        }

        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const name = file.name.toLowerCase();
            try {
                showToast('読込中...');
                if (name.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    document.getElementById('importPreview').value = result.value;
                    showToast('.docx抽出完了');
                } else if (name.endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n\n';
                    }
                    document.getElementById('importPreview').value = fullText;
                    showToast('.pdf抽出完了');
                } else {
                    const reader = new FileReader();
                    reader.onload = function(evt) { document.getElementById('importPreview').value = evt.target.result; showToast('テキスト読込完了'); };
                    reader.readAsText(file);
                }
            } catch (err) { showToast('解析エラー'); }
        });

        function parseAndImportText() {
            const raw = document.getElementById('importPreview').value;
            if (!raw.trim()) return;
            pushHistory();
            const cur = getCur();
            const lines = raw.split(/\r?\n/).filter(l => l.trim() !== '');
            const targetTab = cur.currentTab || cur.tabs[0] || '共通';
            lines.forEach((line, idx) => {
                const text = line.trim();
                const bracketMatch = text.match(/^([【《].*?[】》])\s*(.*)$/);
                let speaker = bracketMatch ? 'KP' : 'KP';
                let content = text;
                const colonMatch = text.match(/^(PC\d+|KP|GM)[：:]\s*(.*)$/i);
                if (colonMatch) {
                    const sp = colonMatch[1].toUpperCase();
                    speaker = sp === 'GM' ? 'KP' : sp;
                    content = colonMatch[2];
                }
                cur.scenariosList.push({ id: 'imp_' + Date.now() + '_' + idx, tab: targetTab, speaker: speaker, text: content });
            });
            document.getElementById('importPreview').value = '';
            document.getElementById('fileInput').value = '';
            save(); renderScenarios(); showToast('インポート完了');
        }

        function renderScenarioSelector() {
            const sel = document.getElementById('scenarioSelect');
            sel.innerHTML = '';
            Object.keys(allData.scenarios).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = allData.scenarios[key].title;
                if (key === allData.currentScenario) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        function switchScenario(key) {
            allData.currentScenario = key;
            editingScenarioId = null;
            save(); renderAll();
        }

        function addScenario() {
            const name = prompt('新しいシナリオ名:');
            if (name && name.trim()) {
                pushHistory();
                const key = 'sc_' + Date.now();
                allData.scenarios[key] = {
                    title: name.trim(),
                    tabs: ['共通', 'PC1', 'KP用', '情報'],
                    currentTab: '共通',
                    customItems: { '共通': [{ label: '移動宣言', text: '【宣言】移動します' }], 'PC1': [], 'KP用': [], '情報': [] },
                    scenariosList: [],
                    sentIds: {}
                };
                allData.currentScenario = key;
                editingScenarioId = null;
                save(); renderAll();
            }
        }

        function renderTabs() {
            const cur = getCur();
            const bar = document.getElementById('tabBar');
            bar.innerHTML = '';
            cur.tabs.forEach(tab => {
                const item = document.createElement('div');
                item.className = `tab-item ${tab === cur.currentTab ? 'active' : ''}`;
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.textContent = tab;
                btn.onclick = () => { cur.currentTab = tab; save(); renderTabs(); renderGrid(); };
                const editBtn = document.createElement('button');
                editBtn.className = 'tab-edit-mini';
                editBtn.innerHTML = '✏️';
                editBtn.onclick = (e) => { e.stopPropagation(); editTab(tab); };
                item.appendChild(btn); item.appendChild(editBtn); bar.appendChild(item);
            });
        }

        function addTab() {
            const cur = getCur();
            const name = prompt('追加するタブ名:');
            if (name && name.trim()) {
                pushHistory();
                const clean = name.trim();
                if (!cur.tabs.includes(clean)) cur.tabs.push(clean);
                if (!cur.customItems[clean]) cur.customItems[clean] = [];
                cur.currentTab = clean;
                save(); renderAll();
            }
        }

        function editTab(oldName) {
            const cur = getCur();
            const action = prompt(`タブ「${oldName}」操作(新名入力 / DEL削除)`, oldName);
            if (action === null) return;
            const newName = action.trim();
            if (newName === '' || newName.toLowerCase() === 'del') {
                if (cur.tabs.length <= 1) { alert('最後尾は削除不可'); return; }
                if (!confirm(`タブ「${oldName}」削除しますか？`)) return;
                pushHistory();
                cur.tabs = cur.tabs.filter(t => t !== oldName);
                delete cur.customItems[oldName];
                const fallbackTab = cur.tabs[0] || '共通';
                cur.scenariosList.forEach(s => { if (s.tab === oldName) s.tab = fallbackTab; });
                if (cur.currentTab === oldName) cur.currentTab = fallbackTab;
                save(); renderAll(); showToast('削除完了');
                return;
            }
            if (newName !== oldName) {
                if (cur.tabs.includes(newName)) { alert('同名タブ存在'); return; }
                pushHistory();
                const idx = cur.tabs.indexOf(oldName);
                if (idx !== -1) cur.tabs[idx] = newName;
                if (cur.customItems[oldName]) { cur.customItems[newName] = cur.customItems[oldName]; delete cur.customItems[oldName]; }
                cur.scenariosList.forEach(s => { if (s.tab === oldName) s.tab = newName; });
                if (cur.currentTab === oldName) cur.currentTab = newName;
                save(); renderAll(); showToast('変更完了');
            }
        }

        function deleteItem(idx) {
            pushHistory();
            getCur().customItems[getCur().currentTab].splice(idx, 1);
            save(); renderGrid();
        }

        window.changeItemTab = function(id, newTab) {
            const cur = getCur();
            const item = cur.scenariosList.find(s => s.id === id);
            if (!item || item.tab === newTab) return;
            pushHistory(); item.tab = newTab; save(); renderScenarios();
        };

        window.insertScenarioItemAfter = function(id) {
            const cur = getCur();
            const idx = cur.scenariosList.findIndex(s => s.id === id);
            if (idx === -1) return;
            const currentItem = cur.scenariosList[idx];
            const speaker = prompt('話者:', currentItem.speaker || 'KP');
            if (speaker === null) return;
            const text = prompt('本文:');
            if (text === null || !text.trim()) return;
            pushHistory();
            cur.scenariosList.splice(idx + 1, 0, { id: 'ins_' + Date.now(), tab: currentItem.tab, speaker: speaker.trim() || 'KP', text: text });
            save(); renderScenarios();
        };

        window.makeItemIndexByFirstChar = function(id) {
            const cur = getCur();
            const item = cur.scenariosList.find(s => s.id === id);
            if (!item || !item.text) return;
            pushHistory();
            item.isIndex = true;
            item.indexTitle = item.text.trim().slice(0, 10);
            save(); renderScenarios(); showToast('目次化');
        };

        window.removeIndexStatus = function(headerId) {
            const cur = getCur();
            const item = cur.scenariosList.find(s => s.id === headerId);
            if (!item) return;
            pushHistory(); item.isIndex = false; delete item.indexTitle; save(); renderScenarios();
        };

        window.editScenarioItem = function(id) { editingScenarioId = id; renderScenarios(); };
        window.cancelInlineEdit = function() { editingScenarioId = null; renderScenarios(); };
        window.saveInlineEdit = function(id) {
            const cur = getCur();
            const item = cur.scenariosList.find(s => s.id === id);
            if (!item) return;
            const speakerInput = document.getElementById(`edit-speaker-${id}`);
            const textInput = document.getElementById(`edit-text-${id}`);
            if (speakerInput && textInput) {
                pushHistory();
                item.speaker = speakerInput.value.trim() || 'KP';
                item.text = textInput.value;
                if (item.indexTitle) item.indexTitle = item.text.trim().slice(0, 10);
                save(); showToast('保存');
            }
            editingScenarioId = null; renderScenarios();
        };

        window.mergeScenarioItemNext = function(id) {
            const cur = getCur();
            const idx = cur.scenariosList.findIndex(s => s.id === id);
            if (idx === -1 || idx === cur.scenariosList.length - 1) return;
            const currentItem = cur.scenariosList[idx];
            const nextItem = cur.scenariosList[idx + 1];
            if (!confirm('下と結合しますか？')) return;
            pushHistory();
            currentItem.text = currentItem.text + '\n' + nextItem.text;
            cur.scenariosList.splice(idx + 1, 1);
            delete cur.sentIds[nextItem.id];
            delete collapsedSentIds[nextItem.id];
            save(); renderScenarios();
        };

        window.splitScenarioItem = function(id) {
            const cur = getCur();
            const item = cur.scenariosList.find(s => s.id === id);
            if (!item) return;
            pushHistory();
            const pos = Math.floor(item.text.length / 2);
            const idx = cur.scenariosList.findIndex(s => s.id === id);
            const newItem1 = { ...item, text: item.text.slice(0, pos) };
            const newItem2 = { id: 'split_' + Date.now(), tab: item.tab, speaker: item.speaker, text: item.text.slice(pos) };
            cur.scenariosList.splice(idx, 1, newItem1, newItem2);
            save(); renderScenarios();
        };

        window.moveScenarioItem = function(id, direction) {
            const cur = getCur();
            const idx = cur.scenariosList.findIndex(s => s.id === id);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= cur.scenariosList.length) return;
            pushHistory();
            const item = cur.scenariosList.splice(idx, 1)[0];
            cur.scenariosList.splice(targetIdx, 0, item);
            save(); renderScenarios();
        };

        window.deleteScenarioItem = function(id) {
            if (!confirm('削除しますか？')) return;
            pushHistory();
            const cur = getCur();
            cur.scenariosList = cur.scenariosList.filter(s => s.id !== id);
            delete cur.sentIds[id];
            delete collapsedSentIds[id];
            if (editingScenarioId === id) editingScenarioId = null;
            save(); renderScenarios();
        };

        window.toggleCollapseSent = function(e, id) {
            e.stopPropagation();
            collapsedSentIds[id] = !collapsedSentIds[id];
            renderScenarios();
        };

        window.toggleAllSentCollapse = function() {
            const cur = getCur();
            const sentList = (cur.scenariosList || []).filter(s => cur.sentIds[s.id]);
            const allCollapsed = sentList.every(s => collapsedSentIds[s.id]);
            sentList.forEach(s => {
                collapsedSentIds[s.id] = !allCollapsed;
            });
            renderScenarios();
            showToast(allCollapsed ? '送信済みを展開しました' : '送信済みを折り畳みました');
        };

        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = `通知: ${msg}`;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.classList.remove('show'); }, 1500);
        }

        function copy(text) {
            navigator.clipboard.writeText(text).then(() => showToast('コピー完了'));
        }

        function renderGrid() {
            const cur = getCur();
            const grid = document.getElementById('buttonGrid');
            grid.innerHTML = '';
            const items = cur.customItems[cur.currentTab] || [];
            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'btn';
                div.innerHTML = `${escapeHTML(item.label)}<button class="del-btn" onclick="event.stopPropagation(); deleteItem(${idx})">✕</button>`;
                div.onclick = () => copy(item.text);
                grid.appendChild(div);
            });
        }

        function renderScenarioIndex(originalList) {
            const indexBar = document.getElementById('scenarioIndexBar');
            if (!indexBar) return;
            indexBar.innerHTML = '';
            const indexItems = originalList.filter(s => s.isIndex || s.indexTitle);
            const allBtn = document.createElement('button');
            allBtn.className = 'scenario-action-btn';
            allBtn.textContent = 'TOP';
            allBtn.onclick = () => { document.getElementById('scenarioList').scrollTo({ top: 0, behavior: 'smooth' }); };
            indexBar.appendChild(allBtn);

            indexItems.forEach(item => {
                const titleText = item.indexTitle || (item.text || '').slice(0, 10);
                const group = document.createElement('div');
                group.className = 'index-item-group';
                const btn = document.createElement('button');
                btn.className = 'scenario-action-btn';
                btn.textContent = titleText.slice(0, 8);
                btn.onclick = () => {
                    const el = document.querySelector(`.scenario-item[data-id="${item.id}"]`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                const delIndexBtn = document.createElement('button');
                delIndexBtn.className = 'scenario-del-btn';
                delIndexBtn.textContent = '✕';
                delIndexBtn.onclick = (e) => { e.stopPropagation(); removeIndexStatus(item.id); };
                group.appendChild(btn); group.appendChild(delIndexBtn); indexBar.appendChild(group);
            });
        }

        function renderScenarios() {
            const cur = getCur();
            const list = document.getElementById('scenarioList');
            list.innerHTML = '';
            const allScenarios = cur.scenariosList || [];
            const sentCount = allScenarios.filter(s => cur.sentIds[s.id]).length;
            document.getElementById('scenarioProgress').textContent = `${sentCount}/${allScenarios.length}`;

            const searchInput = document.getElementById('scenarioSearchInput');
            const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
            renderScenarioIndex(allScenarios);

            let filteredScenarios = allScenarios;
            if (query) {
                filteredScenarios = filteredScenarios.filter(item => {
                    return (item.speaker && item.speaker.toLowerCase().includes(query)) ||
                           (item.text && item.text.toLowerCase().includes(query));
                });
            }

            filteredScenarios.forEach(item => {
                const isSent = !!cur.sentIds[item.id];
                const isCollapsed = isSent && !!collapsedSentIds[item.id];
                const isEditing = editingScenarioId === item.id;
                const div = document.createElement('div');
                div.className = `scenario-item ${isSent ? 'sent' : ''} ${isCollapsed ? 'collapsed' : ''} ${isEditing ? 'editing' : ''}`;
                div.setAttribute('data-id', item.id);
                let tabOptionsHTML = cur.tabs.map(t => `<option value="${escapeHTML(t)}" ${item.tab === t ? 'selected' : ''}>${escapeHTML(t)}</option>`).join('');

                if (isEditing) {
                    div.innerHTML = `
                        <div style="display:flex; flex-direction:column; gap:4px;" onclick="event.stopPropagation()">
                            <input type="text" id="edit-speaker-${item.id}" value="${escapeAttr(item.speaker)}" placeholder="話者">
                            <textarea id="edit-text-${item.id}" rows="4" style="white-space: pre-wrap;">${escapeHTML(item.text)}</textarea>
                            <div style="display:flex; justify-content:flex-end; gap:4px;">
                                <button onclick="cancelInlineEdit()">キャンセル</button>
                                <button onclick="saveInlineEdit('${item.id}')" style="background:var(--primary); color:#fff;">保存</button>
                            </div>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div style="display:flex; gap:6px; align-items:center; justify-content:space-between;">
                            <div style="display:flex; gap:6px; align-items:center;">
                                <input type="checkbox" ${isSent ? 'checked' : ''} onchange="toggleCheck(event, '${item.id}')">
                                <strong style="color:var(--text); font-size:0.7rem;">${escapeHTML(item.speaker)}</strong>
                                ${isSent ? `<span style="color:#34d399; font-size:0.6rem;">✓送信済</span>` : ''}
                                ${isCollapsed ? `<span style="color:var(--text-muted); font-size:0.6rem; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">：${escapeHTML(item.text).split('\n')[0]}...</span>` : ''}
                            </div>
                            ${isSent ? `<button onclick="toggleCollapseSent(event, '${item.id}')" style="font-size:0.55rem; padding:2px 5px;">${isCollapsed ? '▶ 展開' : '▼ 畳む'}</button>` : ''}
                        </div>
                        <div class="scenario-body">${escapeHTML(item.text)}</div>
                        <div class="scenario-actions-top">
                            <div class="actions-row">
                                <select class="item-tab-select" onclick="event.stopPropagation()" onchange="changeItemTab('${item.id}', this.value)">${tabOptionsHTML}</select>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); makeItemIndexByFirstChar('${item.id}')">📌目次</button>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); insertScenarioItemAfter('${item.id}')">+挿入</button>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); moveScenarioItem('${item.id}', -1)">⬆️</button>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); moveScenarioItem('${item.id}', 1)">⬇️</button>
                            </div>
                            <div class="actions-row">
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); editScenarioItem('${item.id}')">✏️編集</button>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); mergeScenarioItemNext('${item.id}')">↓結合</button>
                                <button class="scenario-action-btn" onclick="event.stopPropagation(); splitScenarioItem('${item.id}')">✂️分割</button>
                                <button class="scenario-del-btn" onclick="event.stopPropagation(); deleteScenarioItem('${item.id}')">✕</button>
                            </div>
                        </div>
                    `;
                    div.onclick = (e) => {
                        if (['INPUT', 'BUTTON', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
                        const payload = item.speaker === 'KP' ? item.text : `${item.speaker}：${item.text}`;
                        cur.sentIds[item.id] = true;
                        save(); copy(payload); renderScenarios();
                    };
                }
                list.appendChild(div);
            });
        }

        window.toggleCheck = function(e, id) {
            e.stopPropagation();
            const cur = getCur();
            if (cur.sentIds[id]) {
                delete cur.sentIds[id];
                delete collapsedSentIds[id];
            } else {
                cur.sentIds[id] = true;
            }
            save(); renderScenarios();
        };

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }
        function escapeAttr(str) { return String(str || '').replace(/"/g, '&quot;'); }

        function renderAll() {
            try {
                renderScenarioSelector();
                renderTabs();
                renderGrid();
                renderScenarios();
            } catch (e) {
                console.error('Render error:', e);
            }
        }

        renderAll();
    </script>
</body>
</html>
