<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumaho-coco Pro（GM支援ツール）</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mammoth & PDF.js for import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h2><span>📱</span> <span>Sumaho-coco</span></h2>
            <div class="toolbar">
                <button onclick="undoAction()" style="background:var(--accent-amber); color:#fff; border:none;" title="直前の操作に戻す">↩️戻す</button>
                <button onclick="addTab()">+タブ</button>
                <button onclick="exportDataJson()">保存</button>
                <button onclick="importDataJsonPrompt()">読込</button>
                <button onclick="resetAllData()" style="color:var(--accent-red); border-color:var(--accent-red);">初期化</button>
            </div>
            <input type="file" id="jsonFileInput" style="display:none" accept=".json" onchange="handleJsonFileSelect(event)">
        </header>

        <!-- Scenario Selector -->
        <div class="scenario-select-area">
            <select id="scenarioSelect" onchange="switchScenario(this.value)"></select>
            <button onclick="addScenario()">+シナリオ</button>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar" id="tabBar"></div>
        
        <!-- Quick Grid Items -->
        <div class="grid-container" id="buttonGrid"></div>

        <!-- Vertical Index Bar -->
        <div class="index-bar" id="scenarioIndexBar"></div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="search-area">
                <input type="text" id="scenarioSearchInput" placeholder="話者・本文で検索..." oninput="renderScenarios()">
                <span id="scenarioProgress" style="white-space:nowrap; font-weight:600; color:var(--text-muted);">0/0</span>
                <button onclick="toggleAllSentCollapse()" id="collapseAllBtn" title="送信済みの全体折り畳み/展開">全折り畳み</button>
                <button onclick="resetAllChecks()">全未送信化</button>
                <button onclick="deleteCheckedScenarios()" style="color:var(--accent-red);">選択消去</button>
            </div>
            <div class="scenario-list" id="scenarioList"></div>
        </div>

        <!-- Import Area -->
        <div class="import-area">
            <div style="display:flex; gap:4px; align-items:center;">
                <input type="file" id="fileInput" accept=".txt,.pdf,.docx" style="font-size:0.65rem; flex:1; color:var(--text-muted);">
                <button onclick="parseAndImportText()">インポート</button>
            </div>
            <textarea id="importPreview" placeholder="テキスト直貼り付けまたはファイル（.txt/.pdf/.docx）を読み込み" rows="1"></textarea>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
