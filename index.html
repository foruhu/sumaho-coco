<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumaho-coco</title>
    <style>
        :root {
            --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc; --accent: #03dac6; --text: #e0e0e0; --danger: #ff5252;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 14px; }
        h2 { color: var(--primary); font-size: 1.1rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .tab-btn { background: var(--surface); color: var(--text); border: 1px solid #333; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; white-space: nowrap; flex-shrink: 0; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; border-color: var(--primary); }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input, button { background: var(--surface); color: var(--text); border: 1px solid #333; border-radius: 8px; padding: 8px; font-size: 0.85rem; box-sizing: border-box; }
        .add-box { display: flex; gap: 6px; margin-bottom: 16px; }
        .add-box input:nth-child(1) { flex: 0.4; }
        .add-box input:nth-child(2) { flex: 0.6; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn { background: var(--surface); color: var(--text); border: 1px solid #333; border-radius: 10px; padding: 16px 10px; font-size: 0.9rem; text-align: center; touch-action: manipulation; position: relative; word-break: break-all; }
        .btn:active { background: #333; }
        .del-btn { position: absolute; top: 4px; right: 6px; font-size: 0.65rem; color: var(--danger); background: none; border: none; padding: 2px 4px; }
        #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; transition: transform 0.25s ease-out; z-index: 999; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <h2>📱 Sumaho-coco <button onclick="addTab()" style="font-size:0.75rem; padding:4px 8px;">+タブ追加</button></h2>
    
    <div class="tab-bar" id="tabBar"></div>

    <div class="add-box">
        <input type="text" id="labelInput" placeholder="ラベル (例: 目星)">
        <input type="text" id="textInput" placeholder="コマンド/台詞 (1d100<=70 目星)">
        <button onclick="addItem()">追加</button>
    </div>

    <div class="grid" id="buttonGrid"></div>
    <div id="toast">コピーしました！</div>

    <script>
        let data = JSON.parse(localStorage.getItem('sumaho_coco_tabbed')) || {
            tabs: ['共通', 'PC1', 'KP用'],
            items: {
                '共通': [{ label: '移動宣言', text: '【宣言】移動します' }],
                'PC1': [{ label: '目星', text: '1d100<=70 目星' }],
                'KP用': [{ label: 'シークレット', text: '【KP】シークレットダイス' }]
            }
        };
        let currentTab = data.tabs[0] || '共通';

        function save() {
            localStorage.setItem('sumaho_coco_tabbed', JSON.stringify(data));
        }

        function renderTabs() {
            const bar = document.getElementById('tabBar');
            bar.innerHTML = '';
            data.tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${tab === currentTab ? 'active' : ''}`;
                btn.textContent = tab;
                btn.onclick = () => { currentTab = tab; renderTabs(); renderGrid(); };
                bar.appendChild(btn);
            });
        }

        function addTab() {
            const name = prompt('追加するキャラ名/タブ名（例: PC2, 敵A）:');
            if (name && name.trim()) {
                const clean = name.trim();
                if (!data.tabs.includes(clean)) data.tabs.push(clean);
                if (!data.items[clean]) data.items[clean] = [];
                currentTab = clean;
                save(); renderTabs(); renderGrid();
            }
        }

        function addItem() {
            const label = document.getElementById('labelInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            if (!label || !text) return;
            if (!data.items[currentTab]) data.items[currentTab] = [];
            data.items[currentTab].push({ label, text });
            save();
            document.getElementById('labelInput').value = '';
            document.getElementById('textInput').value = '';
            renderGrid();
        }

        function deleteItem(idx) {
            data.items[currentTab].splice(idx, 1);
            save(); renderGrid();
        }

        function copy(text) {
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById('toast');
                t.textContent = `コピー: ${text}`;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1500);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('buttonGrid');
            grid.innerHTML = '';
            const items = data.items[currentTab] || [];
            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'btn';
                div.innerHTML = `${escapeHTML(item.label)}<button class="del-btn" onclick="event.stopPropagation(); deleteItem(${idx})">✕</button>`;
                div.onclick = () => copy(item.text);
                grid.appendChild(div);
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        renderTabs();
        renderGrid();
        
        async function sendCurrentTab(state, externalClient) {
  const currentTab = state.tabs.find(t => t.id === state.activeTabId);
  if (!currentTab) return;

  // 1. 変数置換・前処理
  const payloadText = replaceMacros(currentTab.text, state.variables);

  // 2. 外部ツール（ココフォリア等）へのディスパッチ
  await externalClient.send({
    channel: currentTab.channel,
    text: payloadText
  });

  // 3. 状態更新（送信済みフラグ + 次のタブへカーソル移動）
  currentTab.sent = true;
  const currentIndex = state.tabs.findIndex(t => t.id === state.activeTabId);
  if (currentIndex < state.tabs.length - 1) {
    state.activeTabId = state.tabs[currentIndex + 1].id;
  }
}

    </script>
</body>
</html>
